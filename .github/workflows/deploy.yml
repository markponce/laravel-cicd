name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Phase 1: Continuous Integration (CI)
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.33' # Match your VPS PHP version
          
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        
      - name: Generate key
        run: php artisan key:generate
        
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
        
      - name: Execute tests
        run: php artisan test

  # Phase 2: Continuous Deployment (CD)
  deploy:
    needs: tests # Only runs if the 'tests' job passes
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 65002
          script: |
            cd /home/u628885034/domains/darkcyan-grouse-421601.hostingersite.com/public_html
            
            # Put app in maintenance mode
            php artisan down
            
            # Pull latest code
            git pull origin main
            
            # Install production dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            
            # Run database migrations
            php artisan migrate --force
            
            # Clear and rebuild caches
            php artisan optimize:clear
            php artisan config:cache
            php artisan event:cache
            php artisan route:cache
            php artisan view:cache
            
            # Bring app back online
            php artisan up
